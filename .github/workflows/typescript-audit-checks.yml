name: TypeScript audit SDK

on:
  push:
    branches: [ci/verify-typescript-audit-pr-9]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    defaults:
      run:
        working-directory: kockpit-libs/typescript/audit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: kockpit-libs/typescript/audit/package.json
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
