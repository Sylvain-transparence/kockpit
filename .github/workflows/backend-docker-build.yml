name: Build Backend Docker Image

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'kockpit-core/**'
      - 'kockpit-features/**'
      - 'kockpit-backends/**'
      - 'kockpit-core-applications/**'
      - '!kockpit-core-applications/kockpit-console/**'
      - 'pom.xml'
      - '.github/workflows/backend-docker-build.yml'
  pull_request:
    branches:
      - main
      - dev
    paths:
      - 'kockpit-core/**'
      - 'kockpit-features/**'
      - 'kockpit-backends/**'
      - 'kockpit-core-applications/**'
      - '!kockpit-core-applications/kockpit-console/**'
      - 'pom.xml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: kockpit-backend-application

jobs:
  build-and-push:
    name: Build and Push Backend Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Set up Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.8

      - name: Cache Maven Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      # build for File System profile
      - name: Build Application with Maven (filesystem)
        run: mvn clean package -Pfilesystem -pl kockpit-core-applications/kockpit-backend-application -am -Dmaven.test.skip=true

      # OpenAPI generation disabled in pom.xml - uncomment if needed
      # - name: Generate OpenAPI Specification
      #   run: mvn verify -Pfilesystem -pl kockpit-core-applications/kockpit-backend-application -Dmaven.test.skip=true
      #   continue-on-error: true

      # - name: Upload OpenAPI Specification
      #   if: always()
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: openapi-spec
      #     path: kockpit-core-applications/kockpit-backend-application/openapi.yml
      #     retention-days: 90
      #     if-no-files-found: warn

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata for Docker
        id: meta-filesystem
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_NAME }}-filesystem
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-,enable=${{ github.event_name != 'pull_request' }}
            type=sha,prefix=pr-${{ github.event.number }}-,enable=${{ github.event_name == 'pull_request' }}
            type=raw,value={{date 'YYYYMMDD-HHmmss'}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: kockpit-core-applications/kockpit-backend-application
          file: kockpit-core-applications/kockpit-backend-application/Dockerfile
          push: true
          tags: ${{ steps.meta-filesystem.outputs.tags }}
          labels: ${{ steps.meta-filesystem.outputs.labels }}

      # build for Azure profile
      - name: Build Application with Maven (azure)
        run: mvn clean package -Pazure -pl kockpit-core-applications/kockpit-backend-application -am -Dmaven.test.skip=true

      - name: Extract Metadata for Docker
        id: meta-azure
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_NAME }}-azure
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-,enable=${{ github.event_name != 'pull_request' }}
            type=sha,prefix=pr-${{ github.event.number }}-,enable=${{ github.event_name == 'pull_request' }}
            type=raw,value={{date 'YYYYMMDD-HHmmss'}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: kockpit-core-applications/kockpit-backend-application
          file: kockpit-core-applications/kockpit-backend-application/Dockerfile
          push: true
          tags: ${{ steps.meta-azure.outputs.tags }}
          labels: ${{ steps.meta-azure.outputs.labels }}

      # build for Azure profile, audits through the native Event Hubs client
      - name: Build Application with Maven (azure-eventhub)
        run: mvn clean package -Pazure-eventhub -pl kockpit-core-applications/kockpit-backend-application -am -Dmaven.test.skip=true

      - name: Extract Metadata for Docker
        id: meta-azure-eventhub
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_NAME }}-azure-eventhub
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-,enable=${{ github.event_name != 'pull_request' }}
            type=sha,prefix=pr-${{ github.event.number }}-,enable=${{ github.event_name == 'pull_request' }}
            type=raw,value={{date 'YYYYMMDD-HHmmss'}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: kockpit-core-applications/kockpit-backend-application
          file: kockpit-core-applications/kockpit-backend-application/Dockerfile
          push: true
          tags: ${{ steps.meta-azure-eventhub.outputs.tags }}
          labels: ${{ steps.meta-azure-eventhub.outputs.labels }}

      # build for AWS Profile
      - name: Build Application with Maven (aws)
        run: mvn clean package -Paws -pl kockpit-core-applications/kockpit-backend-application -am -Dmaven.test.skip=true

      - name: Extract Metadata for Docker
        id: meta-aws
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_NAME }}-aws
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-,enable=${{ github.event_name != 'pull_request' }}
            type=sha,prefix=pr-${{ github.event.number }}-,enable=${{ github.event_name == 'pull_request' }}
            type=raw,value={{date 'YYYYMMDD-HHmmss'}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: kockpit-core-applications/kockpit-backend-application
          file: kockpit-core-applications/kockpit-backend-application/Dockerfile
          push: true
          tags: ${{ steps.meta-aws.outputs.tags }}
          labels: ${{ steps.meta-aws.outputs.labels }}
