# Azure infrastructure: Kafka, OpenSearch, OpenSearch Dashboards and Azurite (see docker-compose-full.yml for the Kockpit applications)
services:
  kafka:
    image: apache/kafka:4.3.1
    container_name: kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,HOST://:29092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,HOST://localhost:29092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - KAFKA_NUM_PARTITIONS=3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

  opensearch:
    image: opensearchproject/opensearch:3.9.0
    container_name: opensearch
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
      - ../opensearch/init/data:/init-data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200"]
      interval: 10s
      timeout: 5s
      retries: 5

  dashboards:
    image: opensearchproject/opensearch-dashboards:3.9.0
    container_name: opensearch-dashboards
    ports:
      - "5601:5601"
    environment:
      - OPENSEARCH_HOSTS=["http://opensearch:9200"]
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    depends_on:
      opensearch:
        condition: service_healthy

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.37.0
    container_name: azurite
    command: azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --location /data --loose --skipApiVersionCheck
    ports:
      - "10000:10000"
    volumes:
      - azurite-data:/data
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "10000"]
      interval: 5s
      timeout: 3s
      retries: 10

  # creates the blob containers in Azurite (the applications don't create them), then uploads the sample
  # manifests of docker/manifests (shared by all profiles) to the manifests container, overwriting the blobs of the
  # same name: docker/manifests is the source of truth, and changes saved from the console to those manifests are
  # lost each time azurite-init runs
  azurite-init:
    image: mcr.microsoft.com/azure-cli:2.91.0
    container_name: azurite-init
    environment:
      - AZURE_STORAGE_CONNECTION_STRING=DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;
      - CONTAINERS=${STORAGE_CONTAINER:-data} ${MANIFESTS_STORAGE_CONTAINER:-manifests}
      - MANIFESTS_CONTAINER=${MANIFESTS_STORAGE_CONTAINER:-manifests}
    volumes:
      - ../manifests:/manifests:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for c in $$CONTAINERS; do
          az storage container create --name "$$c" --output none && echo "container $$c ready"
        done
        for f in /manifests/*.json; do
          name=$$(basename "$$f")
          az storage blob upload --container-name "$$MANIFESTS_CONTAINER" --name "$$name" --file "$$f" --content-type application/json --overwrite --output none
          echo "manifest $$name uploaded to $$MANIFESTS_CONTAINER"
        done
    depends_on:
      azurite:
        condition: service_healthy

volumes:
  opensearch-data:
  azurite-data:
