apiVersion: v2
name: kockpit
description: >-
  Kockpit quick start: Kafka, OpenSearch, the audit stream, the backend (filesystem storage), the web console
  and a sample application, on a single-node cluster (kind, minikube, Docker Desktop). With values-public.yaml,
  a shared instance: local accounts, tenants, API keys and the HTTP ingestion gateway, behind TLS.
