{{- if and (or .Values.auth.local.enabled .Values.postgres.enabled) (not .Values.auth.existingSecret) }}
{{- $name := include "kockpit.secretName" . }}
{{- /* random values are generated once and read back on upgrades (lookup), so passwords never change under the database */}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "kockpit.labels" (dict "root" . "name" "secrets") | nindent 4 }}
  annotations:
    # the PostgreSQL volume outlives the release: so must its password
    helm.sh/resource-policy: keep
type: Opaque
data:
  db-password: {{ if .Values.auth.dbPassword }}{{ .Values.auth.dbPassword | b64enc }}{{ else }}{{ get $existing "db-password" | default (randAlphaNum 32 | b64enc) }}{{ end }}
  jwt-secret: {{ if .Values.auth.jwtSecret }}{{ .Values.auth.jwtSecret | b64enc }}{{ else }}{{ get $existing "jwt-secret" | default (randAlphaNum 64 | b64enc) }}{{ end }}
  admin-password: {{ if .Values.auth.adminPassword }}{{ .Values.auth.adminPassword | b64enc }}{{ else }}{{ get $existing "admin-password" | default (randAlphaNum 24 | b64enc) }}{{ end }}
{{- end }}
